<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0f766e"><link rel="apple-touch-icon" href="icon-192.png"><title>مولّد كروت الأرقام العشوائية</title>
<style>
:root{--bg:#f6f7fb;--sf:#fff;--tx:#1b1f2a;--mu:#667085;--bd:#e3e6ee;--ac:#0f766e;--top:#e0f2fe;--bot:#fef3c7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--sf:#1b2030;--tx:#eef0f6;--mu:#9aa3b5;--bd:#2d3447;--ac:#2dd4bf;--top:#0c3a52;--bot:#4a3b0c}}
:root[data-theme="dark"]{--bg:#12151c;--sf:#1b2030;--tx:#eef0f6;--mu:#9aa3b5;--bd:#2d3447;--ac:#2dd4bf;--top:#0c3a52;--bot:#4a3b0c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;line-height:1.5}
.wrap{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:1.35rem;margin:6px 0 14px}
.panel{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
label{display:block;font-size:.8rem;color:var(--mu);margin-bottom:4px}
input{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:1rem}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
button{border:0;border-radius:10px;padding:12px 16px;font-size:1rem;font-weight:600;cursor:pointer;background:var(--ac);color:#fff;font-family:inherit}
button.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
button:disabled{opacity:.45}
#msg{min-height:1.4em;font-size:.85rem;color:var(--mu);margin-top:8px}
#stats{font-size:.9rem;color:var(--mu);margin:0 2px 10px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:12px;overflow:hidden}
.card .h{font-size:.72rem;color:var(--mu);padding:4px 10px;border-bottom:1px solid var(--bd);display:flex;justify-content:space-between}
.line{display:flex;justify-content:space-around;padding:8px 4px;font-weight:700;font-size:1.05rem;direction:ltr}
.line.t{background:var(--top)}.line.b{background:var(--bot)}
.line{flex-wrap:wrap;gap:2px 6px}.line span{min-width:16px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
<h1>🎴 مولّد كروت الدخول</h1>
<div class="panel">
<div class="row">
<div><label for="n">عدد الكروت (200 كحد أدنى)</label><input id="n" type="number" inputmode="numeric" value="200" min="200" max="100000"></div>
<div><label for="tc">أرقام الصف العلوي</label><input id="tc" type="number" inputmode="numeric" value="5" min="1" max="20"></div>
<div><label for="bc">أرقام الصف السفلي</label><input id="bc" type="number" inputmode="numeric" value="5" min="1" max="20"></div>
</div>
<div class="btns">
<button id="gen">توليد الكروت</button>
<button class="s" id="img" disabled>حفظ كل الصور</button>
</div>
<div id="msg"></div>
</div>
<div id="stats"></div>
<div id="grid"></div>
</div>
<script>
(function(){
var KEY="cards_v2",PER=20,MAXRUN=100000,cards=[],db=null,busy=false,used=0,cap=0;
var $=function(i){return document.getElementById(i)};
function rnd(max){var a=new Uint32Array(1),lim=Math.floor(4294967296/max)*max;do{crypto.getRandomValues(a)}while(a[0]>=lim);return a[0]%max}
function digits(k){var r=[];for(var i=0;i<k;i++)r.push(rnd(10));return r}
function msg(t){$("msg").textContent=t}
function pages(){return Math.ceil(cards.length/PER)}
function clamp(v,lo,hi,d){v=parseInt(v,10);if(isNaN(v))v=d;return Math.max(lo,Math.min(hi,v))}
function cfgNow(){var t=clamp($("tc").value,1,20,5),b=clamp($("bc").value,1,20,5);$("tc").value=t;$("bc").value=b;return{t:t,b:b}}
function prefix(t,b){return t+"x"+b+":"}
function keyOf(c){return prefix(c.top.length,c.bot.length)+c.top.join("")+"|"+c.bot.join("")}
function fmt(x){return x<=1e12?x.toLocaleString("en"):"غير محدود عملياً"}
function openDB(){return new Promise(function(res,rej){var r=indexedDB.open("cardsdb",1);r.onupgradeneeded=function(){var d=r.result;if(!d.objectStoreNames.contains("hist"))d.createObjectStore("hist");if(!d.objectStoreNames.contains("meta"))d.createObjectStore("meta")};r.onsuccess=function(){res(r.result)};r.onerror=function(){rej(r.error)}})}
function countCfg(t,b,cb){
 try{var p=prefix(t,b),r=db.transaction("hist").objectStore("hist").count(IDBKeyRange.bound(p,p+"\uffff"));
  r.onsuccess=function(){cb(r.result)};r.onerror=function(){cb(0)}}catch(e){cb(0)}
}
function refreshStats(){var c=cfgNow();cap=Math.pow(10,c.t+c.b);if(!db){render();return}countCfg(c.t,c.b,function(u){used=u;render()})}
function saveSettings(){try{localStorage.setItem(KEY,JSON.stringify({n:$("n").value,tc:$("tc").value,bc:$("bc").value}))}catch(e){}}
function saveLast(){saveSettings();if(!db)return;try{db.transaction("meta","readwrite").objectStore("meta").put(cards,"last")}catch(e){}}
function runRandom(st,tx,t,b,n,done){
 var out=[],guard=0,lim=n*80;
 function next(){
  if(out.length>=n||guard>=lim)return;
  guard++;
  var c={top:digits(t),bot:digits(b)};
  var rq=st.add(1,keyOf(c));
  rq.onsuccess=function(){out.push(c);if(out.length%1000===0)msg("جاري التوليد… "+out.length+" / "+n);next()};
  rq.onerror=function(e){e.preventDefault();e.stopPropagation();next()};
 }
 tx.oncomplete=function(){done(out)};
 tx.onabort=function(){done(out)};
 next();
}
function runEnum(st,tx,t,b,n,done){
 var p=prefix(t,b),out=[],L=t+b,total=Math.pow(10,L);
 var kr=st.getAllKeys(IDBKeyRange.bound(p,p+"\uffff"));
 tx.oncomplete=function(){done(out)};
 tx.onabort=function(){done(out)};
 kr.onsuccess=function(){
  var seen={};kr.result.forEach(function(k){seen[k]=1});
  var free=[];
  for(var i=0;i<total;i++){var s=String(i);while(s.length<L)s="0"+s;var k=p+s.slice(0,t)+"|"+s.slice(t);if(!seen[k])free.push(s)}
  var m=Math.min(n,free.length);
  for(var j=0;j<m;j++){var r=j+rnd(free.length-j),tmp=free[j];free[j]=free[r];free[r]=tmp}
  for(var q=0;q<m;q++){(function(s){
   var c={top:s.slice(0,t).split("").map(Number),bot:s.slice(t).split("").map(Number)};
   var rq=st.add(1,keyOf(c));
   rq.onsuccess=function(){out.push(c)};
   rq.onerror=function(e){e.preventDefault();e.stopPropagation()};
  })(free[q])}
 };
}
function generate(){
 if(busy||!db)return;
 var c=cfgNow(),n=clamp($("n").value,200,MAXRUN,200);$("n").value=n;
 var total=Math.pow(10,c.t+c.b);
 busy=true;$("gen").disabled=true;msg("جاري التوليد…");
 countCfg(c.t,c.b,function(u){
  var rem=total-u;
  if(rem<=0){busy=false;$("gen").disabled=false;used=u;cap=total;render();msg("تم استهلاك كل التركيبات الممكنة لهذا الإعداد، زد عدد الأرقام");return}
  var nn=Math.min(n,rem),capped=nn<n;
  var tx=db.transaction("hist","readwrite"),st=tx.objectStore("hist");
  var fin=function(out){
   busy=false;$("gen").disabled=false;
   if(out.length)cards=out;
   countCfg(c.t,c.b,function(u2){
    used=u2;cap=total;render();saveLast();
    if(!out.length)msg("لم يتم توليد كروت جديدة");
    else if(out.length<n)msg("تم توليد "+out.length+" كرت فقط، وهو كل ما تبقى من تركيبات هذا الإعداد");
    else msg("تم التوليد ✓ "+out.length+" كرت جديد غير مكرر أبداً، سيتم حفظ "+pages()+" صورة");
   });
  };
  if(c.t+c.b<=6)runEnum(st,tx,c.t,c.b,nn,fin);else runRandom(st,tx,c.t,c.b,nn,fin);
 });
}
function render(){
 var g=$("grid");g.textContent="";
 var f=document.createDocumentFragment();
 cards.slice(0,200).forEach(function(c,i){
  var d=document.createElement("div");d.className="card";
  var h=document.createElement("div");h.className="h";h.innerHTML="<span>كرت</span><span>"+(i+1)+"</span>";
  d.appendChild(h);
  [["t",c.top],["b",c.bot]].forEach(function(p){
   var l=document.createElement("div");l.className="line "+p[0];
   p[1].forEach(function(v){var s=document.createElement("span");s.textContent=v;l.appendChild(s)});
   d.appendChild(l);
  });
  f.appendChild(d);
 });
 g.appendChild(f);
 $("stats").textContent=(cards.length?"عدد الكروت: "+cards.length+" — عدد الصور: "+pages()+(cards.length>200?" (المعروض أول 200 فقط)":"")+" — ":"")+"المولّد بهذا الإعداد: "+used.toLocaleString("en")+" من أصل "+fmt(cap);
 $("img").disabled=!cards.length;
}
function rr(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath()}
function pageBlob(p){
 var mc=Math.max(cards[0].top.length,cards[0].bot.length);
 var cols=mc<=7?4:2,rows=PER/cols,cw=cols===4?220:420,ch=200,gap=14,pad=30,th=60;
 var sp=Math.min(40,(cw-24)/mc),fs=Math.max(10,Math.min(32,Math.floor(sp*0.85)));
 var W=pad*2+cols*cw+(cols-1)*gap,H=pad*2+th+rows*ch+(rows-1)*gap;
 var cv=document.createElement("canvas");cv.width=W;cv.height=H;
 var x=cv.getContext("2d");
 x.fillStyle="#ffffff";x.fillRect(0,0,W,H);
 var list=cards.slice(p*PER,p*PER+PER);
 x.fillStyle="#1b1f2a";x.font="bold 30px Arial,sans-serif";x.textAlign="left";x.textBaseline="middle";
 x.fillText("Page "+(p+1)+" / "+pages()+"   Cards "+(p*PER+1)+" - "+(p*PER+list.length),pad,pad+th/2);
 list.forEach(function(c,i){
  var col=i%cols,row=Math.floor(i/cols);
  var X=pad+col*(cw+gap),Y=pad+th+row*(ch+gap);
  x.save();rr(x,X,Y,cw,ch,12);x.clip();
  x.fillStyle="#f1f5f9";x.fillRect(X,Y,cw,40);
  x.fillStyle="#e0f2fe";x.fillRect(X,Y+40,cw,80);
  x.fillStyle="#fef3c7";x.fillRect(X,Y+120,cw,80);
  x.restore();
  x.strokeStyle="#94a3b8";x.lineWidth=2;rr(x,X,Y,cw,ch,12);x.stroke();
  x.fillStyle="#475569";x.font="bold 20px Arial,sans-serif";x.textAlign="center";
  x.fillText("#"+(p*PER+i+1),X+cw/2,Y+20);
  x.fillStyle="#0f172a";x.font="bold "+fs+"px Arial,sans-serif";
  [c.top,c.bot].forEach(function(arr,k){
   var x0=X+cw/2-(arr.length-1)*sp/2;
   arr.forEach(function(v,j){x.fillText(String(v),x0+j*sp,Y+80+k*80)});
  });
 });
 return new Promise(function(res){cv.toBlob(res,"image/png")});
}
async function saveImg(d,p,tries){
 try{
  var blob=await pageBlob(p);
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="cards-"+String(p+1).padStart(2,"0")+".png";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},10000);await new Promise(function(r){setTimeout(r,800)});
  return true;
 }catch(e){
  msg("تعذر حفظ الصورة "+(p+1));
  return false;
 }
}
$("img").onclick=async function(){
 $("img").disabled=true;
 var n=pages();
 for(var p=0;p<n;p++){
  msg("حفظ الصورة "+(p+1)+" من "+n+"…");
  if(!(await saveImg(null,p))){$("img").disabled=false;return}
 }
 msg("تم حفظ "+n+" صورة ✓");
 $("img").disabled=false;
};
$("gen").onclick=generate;
$("tc").onchange=$("bc").onchange=refreshStats;
function init(){
 try{var s0=JSON.parse(localStorage.getItem(KEY)||"null");if(s0){$("n").value=s0.n||200;$("tc").value=s0.tc||5;$("bc").value=s0.bc||5}}catch(e){}
 try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
 if(!window.indexedDB){msg("هذا المتصفح لا يدعم التخزين اللازم لمنع التكرار");$("gen").disabled=true;refreshStats();return}
 openDB().then(function(d){
  db=d;
  var r=db.transaction("meta").objectStore("meta").get("last");
  r.onsuccess=function(){
   var l=r.result;
   if(l&&l.length&&l.every(function(c){return c.top.concat(c.bot).every(function(v){return v>=0&&v<=9})})){cards=l;msg("تم استرجاع آخر كروت مولّدة")}
   refreshStats();
  };
  r.onerror=refreshStats;
 }).catch(function(){msg("تعذر فتح التخزين، لن يعمل منع التكرار");$("gen").disabled=true;refreshStats()});
}
init();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(function(){});
})();
</script>
</body>
</html>
